  <script>
    (() => {
      "use strict";
      const VERSION = "GREEN-MEMBER-MOBILE-TYPE-R2-20261003";

      function fixHeroTitle() {
        const heading = document.querySelector(".dpro-customer-hero__copy h1");
        if (!heading || heading.dataset.mobileTypeR2 === VERSION) return;
        const title = (heading.textContent || "").trim();
        const splitAt = title.indexOf("、");
        if (splitAt < 0 || title.length < 8) return;

        const first = document.createElement("span");
        first.className = "dpro-customer-hero__title-line";
        first.textContent = title.slice(0, splitAt + 1);

        const second = document.createElement("span");
        second.className = "dpro-customer-hero__title-line";
        second.textContent = title.slice(splitAt + 1);

        heading.replaceChildren(first, second);
        heading.dataset.mobileTypeR2 = VERSION;
      }

      function start() {
        fixHeroTitle();
        const host = document.querySelector("[data-dpro-customer-hero]");
        if (!host) return;
        const observer = new MutationObserver(() => fixHeroTitle());
        observer.observe(host, {childList:true, subtree:true, characterData:true});
        window.setTimeout(fixHeroTitle, 200);
        window.setTimeout(fixHeroTitle, 700);
        window.setTimeout(fixHeroTitle, 1500);
      }

      document.documentElement.dataset.greenMemberMobileType = VERSION;
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, {once:true});
      } else {
        start();
      }
    })();
  </script>
