name: DPRO GREEN Customer Contact R1.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GREEN production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard audited baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:green-customer-contact-r1.js)" = "f78a31fb9231aa00c7dd607460ad25f93f4d3b61"
          test "$(git rev-parse HEAD:owner.html)" = "3398185cd75056248ef2f29c1797087bbb2e2ce4"
          echo "CUSTOMER CONTACT R1.5 AUDITED BASELINE PASS"

      - name: Apply send guard R1.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"{label}: anchor not found")
              return text.replace(old, new, 1)

          p = Path("green-customer-contact-r1.js")
          s = p.read_text(encoding="utf-8")

          s = replace_once(
              s,
              'const VERSION = "GREEN-CUSTOMER-CONTACT-R1.4-BUILD-AUTH-FALLBACK-20261004";',
              'const VERSION = "GREEN-CUSTOMER-CONTACT-R1.5-SEND-GUARD-20261004";',
              "version"
          )

          s = replace_once(
              s,
              '営業案件化する受付情報を確認中です。必要な場合は「営業対応」から登録できます。',
              '営業案件化する受付情報がまだ紐付いていません。必要な場合は「営業案件」から登録できます。',
              "line lead wording"
          )

          old_submit = '''    $("#gcc-line-reply")?.addEventListener("submit", async (event) => {
                event.preventDefault();
                const textarea = $("#gcc-line-text");
                const value = textarea?.value.trim();
                if (!value) return;
                const button = event.submitter;
                if (button) { button.disabled = true; button.textContent = "送信中…"; }
                try {
                  await lineApi(`/api/contact/threads/${encodeURIComponent(item.id)}/reply`, {
                    method:"POST", body:JSON.stringify({ text:value })
                  });
                  if (textarea) textarea.value = "";
                  window.Green?.toast?.("LINEへ返信しました。", "success");
                  await loadUnified(true);
                  const same = state.items.find((x) => x.key === item.key);
                  if (same) await selectItem(same, false);
                } catch (error) {
                  window.Green?.toast?.(`LINE返信に失敗しました。${error.message}`, "error");
                } finally {
                  if (button) { button.disabled = false; button.textContent = "LINEへ返信"; }
                }
              });'''

          new_submit = '''    $("#gcc-line-reply")?.addEventListener("submit", async (event) => {
                event.preventDefault();
                const textarea = $("#gcc-line-text");
                const value = textarea?.value.trim();
                if (!value) return;

                const closedNotice = item.status === "closed"
                  ? "この会話は対応完了です。返信すると「対応中」に戻します。\\n\\n"
                  : "";

                const ok = window.confirm(
                  closedNotice +
                  "この内容をLINEへ送信します。\\n\\n" +
                  value +
                  "\\n\\n送信してよろしいですか？"
                );
                if (!ok) return;

                const button = event.submitter;
                if (button) { button.disabled = true; button.textContent = "送信中…"; }

                try {
                  if (item.status === "closed") {
                    await lineApi(`/api/contact/threads/${encodeURIComponent(item.id)}/status`, {
                      method:"POST",
                      body:JSON.stringify({ status:"open" })
                    });
                    item.status = "open";
                  }

                  await lineApi(`/api/contact/threads/${encodeURIComponent(item.id)}/reply`, {
                    method:"POST", body:JSON.stringify({ text:value })
                  });

                  if (textarea) textarea.value = "";
                  window.Green?.toast?.("LINEへ返信しました。", "success");

                  await loadUnified(true);
                  const same = state.items.find((x) => x.key === item.key);
                  if (same) await selectItem(same, false);
                } catch (error) {
                  window.Green?.toast?.(`LINE返信に失敗しました。${error.message}`, "error");
                } finally {
                  if (button) { button.disabled = false; button.textContent = "LINEへ返信"; }
                }
              });'''

          s = replace_once(s, old_submit, new_submit, "line send guard")
          p.write_text(s, encoding="utf-8")

          p = Path("owner.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "green-customer-contact-r1.js?v=GREEN-CUSTOMER-CONTACT-R1.4-BUILD-AUTH-FALLBACK-20261004",
              "green-customer-contact-r1.js?v=GREEN-CUSTOMER-CONTACT-R1.5-SEND-GUARD-20261004"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check green-customer-contact-r1.js
          grep -q 'GREEN-CUSTOMER-CONTACT-R1.5-SEND-GUARD-20261004' green-customer-contact-r1.js
          grep -q 'GREEN-CUSTOMER-CONTACT-R1.5-SEND-GUARD-20261004' owner.html
          grep -q 'この内容をLINEへ送信します。' green-customer-contact-r1.js
          grep -q '返信すると「対応中」に戻します。' green-customer-contact-r1.js
          grep -q 'status:"open"' green-customer-contact-r1.js
          grep -q '「営業案件」から登録できます。' green-customer-contact-r1.js
          grep -q 'Promise.allSettled' green-customer-contact-r1.js
          grep -q 'const EMAIL_READY = false' green-customer-contact-r1.js
          grep -q 'function lineAttachmentHtml' green-customer-contact-r1.js
          grep -q 'const LINE_BUILD_KEY = "dpro_green_line_build_code"' green-customer-contact-r1.js
          grep -q 'params.get("view") === "customer-contact"' green-customer-contact-r1.js
          git diff --check
          echo "GREEN CUSTOMER CONTACT R1.5 STATIC QA PASS"

      - name: Commit R1.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN CUSTOMER CONTACT R1.5"
          git config user.email "actions@users.noreply.github.com"
          git add green-customer-contact-r1.js owner.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add send guard to GREEN customer contact R1.5"
          git push origin HEAD:main
