name: DPRO GREEN Blog Schedule Past Date Fix R1.3.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix scheduled date rollover
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os,base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_blog_schedule_past_date_fix.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check green-owner-blog-r1.js
          node --check config.js
          grep -q "planned.getTime()<=Date.now()" green-owner-blog-r1.js
          grep -q "GREEN-OWNER-BLOG-R1.3.1-SCHEDULE-FIX-20261007" green-owner-blog-r1.js
          grep -q "GREEN-BLOG-CMS-OWNER-R1.3.1-SCHEDULE-FIX-20261007" config.js
          grep -q "GREEN-BLOG-CMS-OWNER-R1.3.1-SCHEDULE-FIX-20261007" owner.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-schedule-past-date-fix-r1-3-1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix GREEN blog scheduled date rollover R1.3.1"
          git push
