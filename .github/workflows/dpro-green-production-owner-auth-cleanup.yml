name: DPRO GREEN Production Owner Auth Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production Owner auth cleanup
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_owner_production.py
          python /tmp/patch_owner_production.py

      - name: Verify diff
        run: git diff --check && git diff --stat

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html owner.js
          git commit -m "Harden production Owner auth UX"
          git push
