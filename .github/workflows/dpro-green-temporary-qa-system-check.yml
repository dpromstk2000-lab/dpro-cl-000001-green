name: DPRO GREEN Temporary QA System Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create read-only QA system check
        shell: bash
        run: |
          echo '' | base64 -d > system-check-qa.html

      - name: Verify
        shell: bash
        run: |
          test -s system-check-qa.html
          grep -q "TEMP QA PREVIEW" system-check-qa.html
          grep -q "本番SYSTEM CHECK" system-check-qa.html
          grep -q "Owner Auth /health" system-check-qa.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add system-check-qa.html
          git commit -m "Add temporary read-only production QA system check"
          git push
