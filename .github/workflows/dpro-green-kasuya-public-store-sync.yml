name: DPRO GREEN Kasuya Public Store Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-green-kasuya-public-store-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply public store information sync
        shell: python
        run: |
          from pathlib import Path

          html_path = Path("index.html")
          js_path = Path("index.js")
          css_path = Path("styles.css")

          html = html_path.read_text(encoding="utf-8")
          js = js_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          marker = 'data-dpro-store-sync="GREEN-KASUYA-R1"'
          if marker not in html:
              anchor = '    <div class="page-shell">\n'
              if anchor not in html:
                  raise SystemExit("index.html page-shell anchor not found")

              store_section = '''    <div class="page-shell">
      <section class="public-store-info" data-dpro-store-sync="GREEN-KASUYA-R1" id="store-info" hidden aria-labelledby="store-info-title">
        <div class="public-store-heading">
          <div>
            <p class="eyebrow">STORE INFORMATION</p>
            <h2 id="store-info-title">店舗案内</h2>
          </div>
          <p>ご相談・現地確認の前に、営業時間や所在地をご確認いただけます。</p>
        </div>
        <div class="public-store-grid">
          <article class="public-store-card public-store-card-wide">
            <span class="public-store-icon" aria-hidden="true">📍</span>
            <div>
              <small>所在地</small>
              <strong data-public-address>—</strong>
            </div>
          </article>
          <article class="public-store-card">
            <span class="public-store-icon" aria-hidden="true">🕘</span>
            <div>
              <small>営業時間</small>
              <strong data-public-hours>—</strong>
            </div>
          </article>
          <article class="public-store-card">
            <span class="public-store-icon" aria-hidden="true">📅</span>
            <div>
              <small>休業案内</small>
              <strong data-public-closed>—</strong>
            </div>
          </article>
          <article class="public-store-card">
            <span class="public-store-icon" aria-hidden="true">☎</span>
            <div>
              <small>電話</small>
              <a data-public-phone href="#" aria-label="店舗へ電話">—</a>
            </div>
          </article>
        </div>
      </section>

'''
              html = html.replace(anchor, store_section, 1)

          if 'function applyPublicFacilityProfile' not in js:
              function_anchor = '  async function initialize() {\n'
              if function_anchor not in js:
                  raise SystemExit("index.js initialize anchor not found")

              helper = '''  function applyPublicFacilityProfile(facility) {
    const section = document.querySelector("[data-dpro-store-sync]");
    if (!section || !facility) return;

    document.querySelectorAll("[data-facility-name]").forEach((node) => {
      if (facility.facilityName) node.textContent = facility.facilityName;
    });

    const addressNode = section.querySelector("[data-public-address]");
    const hoursNode = section.querySelector("[data-public-hours]");
    const closedNode = section.querySelector("[data-public-closed]");
    const phoneNode = section.querySelector("[data-public-phone]");

    if (addressNode) {
      const fullAddress = [facility.postalCode ? `〒${facility.postalCode}` : "", facility.address || ""]
        .filter(Boolean)
        .join(" ");
      addressNode.textContent = fullAddress || "所在地はお問い合わせください";
    }
    if (hoursNode) hoursNode.textContent = facility.businessHours || "営業時間はお問い合わせください";
    if (closedNode) closedNode.textContent = facility.closedDays || "休業日はお問い合わせください";

    if (phoneNode) {
      if (facility.phone) {
        phoneNode.textContent = facility.phone;
        phoneNode.href = `tel:${String(facility.phone).replace(/[^0-9+]/g, "")}`;
        phoneNode.hidden = false;
      } else {
        phoneNode.textContent = "電話番号はお問い合わせください";
        phoneNode.removeAttribute("href");
      }
    }

    section.hidden = false;
  }

'''
              js = js.replace(function_anchor, helper + function_anchor, 1)

          old_init = '''      document.querySelectorAll("[data-facility-name]").forEach((node) => { node.textContent = facilityResponse.data.facilityName; });
      const serviceCount = servicesResponse.data.services?.length || 0;'''
          new_init = '''      applyPublicFacilityProfile(facilityResponse.data || {});
      const serviceCount = servicesResponse.data.services?.length || 0;'''
          if old_init in js:
              js = js.replace(old_init, new_init, 1)
          elif 'applyPublicFacilityProfile(facilityResponse.data || {});' not in js:
              raise SystemExit("index.js facility initialization target not found")

          css_marker = "/* GREEN KASUYA PUBLIC STORE SYNC R1 */"
          if css_marker not in css:
              css += r'''

/* GREEN KASUYA PUBLIC STORE SYNC R1 */
.public-store-info{
  margin:0 0 48px;
  padding:28px;
  border:1px solid var(--green-300);
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f3faf5);
  box-shadow:var(--shadow-soft);
}
.public-store-info[hidden]{display:none!important}
.public-store-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:20px;
}
.public-store-heading h2{margin:0;font-size:clamp(25px,3vw,34px)}
.public-store-heading p:not(.eyebrow){
  max-width:560px;
  margin:0;
  color:var(--muted);
}
.public-store-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.public-store-card{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-height:100px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
}
.public-store-card-wide{grid-column:span 2}
.public-store-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:12px;
  background:var(--green-100);
  font-size:20px;
}
.public-store-card small{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.public-store-card strong,
.public-store-card a{
  color:var(--ink);
  font-size:15px;
  line-height:1.65;
  font-weight:800;
  text-decoration:none;
}
.public-store-card a:hover{text-decoration:underline}

@media (max-width:760px){
  .public-store-info{padding:20px 16px;margin-bottom:36px}
  .public-store-heading{display:block}
  .public-store-heading p:not(.eyebrow){margin-top:8px}
  .public-store-grid{grid-template-columns:1fr}
  .public-store-card-wide{grid-column:auto}
}
'''

          html_path.write_text(html, encoding="utf-8")
          js_path.write_text(js, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")

      - name: Safety checks
        shell: bash
        run: |
          grep -q 'data-dpro-store-sync="GREEN-KASUYA-R1"' index.html
          grep -q 'applyPublicFacilityProfile' index.js
          grep -q '/api/public/facility' index.js
          grep -q 'GREEN KASUYA PUBLIC STORE SYNC R1' styles.css
          grep -q 'FACILITY_CODE: "cl_000001_green"' config.js
          ! grep -q 'FACILITY_CODE: "dpro_green_rental_demo"' config.js
          ! grep -q 'DEMO_MEMBER_TOKEN: "GREEN-DEMO"' config.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "DPRO GREEN Public Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html index.js styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Show Kasuya production store information on public form"
          git push origin HEAD:main
