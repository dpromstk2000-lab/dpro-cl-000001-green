name: DPRO GREEN Kasuya Owner Auth Frontend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-green-kasuya-owner-auth-frontend.yml"

permissions:
  contents: write

jobs:
  install-owner-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DPRO Owner Auth frontend
        shell: python
        run: |
          from pathlib import Path
          import base64
          payload = {'owner-login.html': '', 'owner-activate.html': '', 'dpro-auth-guard.js': '', 'system-check.html': '', 'system-check.js': ''}
          for name, data in payload.items():
              Path(name).write_bytes(base64.b64decode(data))

          guard = '<script>window.DPRO_AUTH_CONFIG={project:"GENERAL",system:"GREEN",facility:"cl_000001_green",loginUrl:"./owner-login.html",protectedApiOrigins:["https://dpro-cl-000001-green-core.dpromstk2000.workers.dev"]};</script><script src="dpro-auth-guard.js?v=DPRO-AUTH-7-GREEN-KASUYA-R1-20260926"></script>'

          owner = Path("owner.html")
          s = owner.read_text(encoding="utf-8")
          s = s.replace('<p class="owner-login-note">デモ管理コード：1234</p>', '<p class="owner-login-note">DPRO共通認証で安全にログインします。</p>')
          if 'DPRO-AUTH-7-GREEN-KASUYA-R1-20260926' not in s:
              s = s.replace('</head>', guard + '</head>', 1)
          owner.write_text(s, encoding="utf-8")

          ipad = Path("owner-ipad.html")
          s = ipad.read_text(encoding="utf-8")
          s = s.replace('<small>デモ管理コード：1234</small>', '<small>DPRO共通認証でログインします。</small>')
          if 'DPRO-AUTH-7-GREEN-KASUYA-R1-20260926' not in s:
              s = s.replace('</head>', guard + '</head>', 1)
          ipad.write_text(s, encoding="utf-8")

      - name: Production safety checks
        shell: bash
        run: |
          test -f owner-login.html
          test -f owner-activate.html
          test -f dpro-auth-guard.js
          grep -q 'DPRO共通認証で安全にログインします' owner.html
          grep -q 'DPRO共通認証でログインします' owner-ipad.html
          grep -q '本番システム確認' system-check.html
          ! grep -q 'デモ管理コード：1234' owner.html
          ! grep -q 'デモ管理コード：1234' owner-ipad.html
          ! grep -q 'デモ基本データを準備' system-check.html
          node --check dpro-auth-guard.js
          node --check system-check.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "DPRO Owner Auth Installer"
          git config user.email "actions@users.noreply.github.com"
          git add owner-login.html owner-activate.html dpro-auth-guard.js owner.html owner-ipad.html system-check.html system-check.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add DPRO owner self-activation frontend"
          git push origin HEAD:main
