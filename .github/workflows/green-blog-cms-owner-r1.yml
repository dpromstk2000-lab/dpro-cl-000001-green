name: DPRO GREEN Blog CMS Owner R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write blog CMS assets
        shell: python
        env:
          BLOG_JS_B64: ""
          BLOG_CSS_B64: ""
          BLOG_LOADER_B64: ""
        run: |
          import os, base64, re
          from pathlib import Path

          Path("green-owner-blog-r1.js").write_bytes(base64.b64decode(os.environ["BLOG_JS_B64"]))
          Path("green-owner-blog-r1.css").write_bytes(base64.b64decode(os.environ["BLOG_CSS_B64"]))

          config = Path("config.js")
          text = config.read_text(encoding="utf-8")
          marker = "GREEN-BLOG-CMS-OWNER-R1-20261006"
          if marker not in text:
              text += "\n" + base64.b64decode(os.environ["BLOG_LOADER_B64"]).decode("utf-8") + "\n"
          config.write_text(text, encoding="utf-8")

          flow = Path("green-owner-flow.js")
          f = flow.read_text(encoding="utf-8")
          old = '{ label: "店舗設定", keys: ["facility-settings", "business-calendar", "announcements", "features"] }'
          new = '{ label: "店舗設定", keys: ["facility-settings", "business-calendar", "announcements", "blog", "features"] }'
          if old in f:
              f = f.replace(old, new, 1)
          elif new not in f:
              raise SystemExit("green-owner-flow group anchor not found")
          flow.write_text(f, encoding="utf-8")

          owner = Path("owner.html")
          h = owner.read_text(encoding="utf-8")
          h = re.sub(r'config\.js\?v=[^"\']+', 'config.js?v=GREEN-BLOG-CMS-OWNER-R1-20261006', h, count=1)
          owner.write_text(h, encoding="utf-8")

      - name: Validate
        shell: bash
        run: |
          node --check green-owner-blog-r1.js
          node --check green-owner-flow.js
          node --check config.js
          grep -q 'GREEN-BLOG-CMS-OWNER-R1-20261006' config.js
          grep -q '"announcements", "blog", "features"' green-owner-flow.js
          grep -q 'GREEN-BLOG-CMS-OWNER-R1-20261006' owner.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-cms-owner-r1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add GREEN owner blog CMS R1"
          git push
