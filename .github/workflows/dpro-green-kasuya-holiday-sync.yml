name: DPRO GREEN Kasuya Holiday Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-green-kasuya-holiday-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect public holiday sync
        shell: python
        run: |
          import base64
          exec(base64.b64decode("").decode("utf-8"))

      - name: Safety checks
        shell: bash
        run: |
          grep -q 'id="public-holidays"' index.html
          grep -q 'upcomingHolidays' index.js
          grep -q '/api/public/site-profile?target=public_form' index.js
          grep -q 'GREEN KASUYA HOLIDAY SYNC R1' styles.css
          grep -q 'FACILITY_CODE: "cl_000001_green"' config.js
          ! grep -q 'FACILITY_CODE: "dpro_green_rental_demo"' config.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "DPRO GREEN Holiday Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html index.js styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Connect Kasuya public holiday and special-hours sync"
          git push origin HEAD:main
