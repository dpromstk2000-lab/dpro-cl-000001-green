name: DPRO GREEN Kasuya Public Store Sync R2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-green-kasuya-public-store-sync-r2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production store sync
        shell: python
        run: |
          import base64
          exec(base64.b64decode("").decode("utf-8"))

      - name: Safety checks
        shell: bash
        run: |
          grep -q 'data-dpro-store-sync="GREEN-KASUYA-R1"' index.html
          grep -q 'applyPublicFacilityProfile' index.js
          grep -q '/api/public/facility' index.js
          grep -q 'GREEN KASUYA PUBLIC STORE SYNC R1' styles.css
          grep -q 'FACILITY_CODE: "cl_000001_green"' config.js
          ! grep -q 'FACILITY_CODE: "dpro_green_rental_demo"' config.js
          ! grep -q 'DEMO_MEMBER_TOKEN: "GREEN-DEMO"' config.js

      - name: Remove broken R1 workflow
        shell: bash
        run: |
          rm -f .github/workflows/dpro-green-kasuya-public-store-sync.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "DPRO GREEN Public Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Show Kasuya production store information on public form"
          git push origin HEAD:main
