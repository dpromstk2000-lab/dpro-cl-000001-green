name: DPRO GREEN Customer Contact R1.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GREEN production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard audited baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:green-customer-contact-r1.js)" = "89bf4e7f55b13073c50e0dcbe64fa16c7dc7d61c"
          test "$(git rev-parse HEAD:owner.html)" = "dbb5633e6eb1f9b75edadf78f52e713b4bd59393"
          test "$(git rev-parse HEAD:green-customer-contact-r1.css)" = "dbfdfa92978330a68af26d90b5ba5e1e36abfd1c"
          echo "CUSTOMER CONTACT R1.3 AUDITED BASELINE PASS"

      - name: Apply resilient fetch R1.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"{label}: anchor not found")
              return text.replace(old, new, 1)

          # green-customer-contact-r1.js
          p = Path("green-customer-contact-r1.js")
          s = p.read_text(encoding="utf-8")

          s = replace_once(
              s,
              'const VERSION = "GREEN-CUSTOMER-CONTACT-R1.2-20261004";',
              'const VERSION = "GREEN-CUSTOMER-CONTACT-R1.3-RESILIENT-FETCH-20261004";',
              "version"
          )

          old_state = '''  const state = {
              initialized: false,
              loading: false,
              items: [],
              filtered: [],
              selected: null,
              lineThreads: [],
              lineInquiryByUser: new Map(),
              channel: "all",
              query: ""
            };'''
          new_state = '''  const state = {
              initialized: false,
              loading: false,
              items: [],
              filtered: [],
              selected: null,
              lineThreads: [],
              lineInquiryByUser: new Map(),
              channelErrors: [],
              channel: "all",
              query: ""
            };'''
          s = replace_once(s, old_state, new_state, "state")

          old_token = '''  function token() {
              try { return sessionStorage.getItem("green_admin_session_token") || ""; }
              catch { return ""; }
            }

            async function lineApi(path, options = {}) {
              const accessToken = token();
              if (!accessToken) throw new Error("管理セッションを確認できません。再ログインしてください。");

              const headers = new Headers(options.headers || {});
              headers.set("Authorization", `Bearer ${accessToken}`);
              headers.set("Accept", "application/json");
              if (options.body && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");

              const response = await fetch(`${LINE_API}${path}`, {
                ...options,
                headers,
                credentials: "include",
                cache: "no-store"
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data?.ok === false) {
                throw new Error(data?.message || data?.error || `LINE API HTTP ${response.status}`);
              }
              return data;
            }'''

          new_token = '''  function token() {
              try { return sessionStorage.getItem("green_admin_session_token") || ""; }
              catch { return ""; }
            }

            function lineAccessToken() {
              const normal = token();
              if (normal) return normal;

              const buildMode = new URLSearchParams(location.search).get("dpro_build") === "1";
              if (!buildMode) return "";

              try {
                const build = sessionStorage.getItem("dpro_green_line_build_code")
                  || sessionStorage.getItem("dpro_green_shop_build_code")
                  || "";
                return build ? `build:${build}` : "";
              } catch {
                return "";
              }
            }

            async function lineApi(path, options = {}) {
              const accessToken = lineAccessToken();
              if (!accessToken) throw new Error("LINE用の管理セッションを確認できません。再ログインしてください。");

              const headers = new Headers(options.headers || {});
              headers.set("Authorization", `Bearer ${accessToken}`);
              headers.set("Accept", "application/json");
              if (options.body && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");

              let response;
              try {
                response = await fetch(`${LINE_API}${path}`, {
                  ...options,
                  headers,
                  cache: "no-store"
                });
              } catch (error) {
                throw new Error(`LINE接続に失敗しました。${error?.message || "通信エラー"}`);
              }

              const data = await response.json().catch(() => ({}));
              if (!response.ok || data?.ok === false) {
                throw new Error(data?.message || data?.error || `LINE API HTTP ${response.status}`);
              }
              return data;
            }'''
          s = replace_once(s, old_token, new_token, "line API transport")

          old_mail = '''      <div class="gcc-mail-wait" id="gcc-mail-wait">
                  <strong>WEBメール返信は独自ドメイン設定待ち</strong>
                  <span>受信・内容確認・営業案件化は利用できます。ドメイン確定後に、この画面からのメール返信を有効化します。</span>
                </div>

                <div class="gcc-toolbar">'''
          new_mail = '''      <div class="gcc-mail-wait" id="gcc-mail-wait">
                  <strong>WEBメール返信は独自ドメイン設定待ち</strong>
                  <span>受信・内容確認・営業案件化は利用できます。ドメイン確定後に、この画面からのメール返信を有効化します。</span>
                </div>

                <div class="gcc-channel-warning" id="gcc-channel-warning" hidden></div>

                <div class="gcc-toolbar">'''
          s = replace_once(s, old_mail, new_mail, "warning container")

          insert_anchor = '''  async function enrichLineInquiries(inquiries) {'''
          helper = '''  function renderChannelWarning() {
              const box = $("#gcc-channel-warning");
              if (!box) return;

              if (!state.channelErrors.length) {
                box.hidden = true;
                box.innerHTML = "";
                return;
              }

              box.hidden = false;
              box.innerHTML = `
                <strong>一部チャネルを取得できませんでした</strong>
                <span>${state.channelErrors.map((x) => esc(x)).join(" / ")}</span>
                <small>取得できたチャネルはそのまま表示しています。「再表示」で再試行できます。</small>
              `;
            }

          '''
          if "function renderChannelWarning()" not in s:
              if insert_anchor not in s:
                  raise SystemExit("warning helper anchor not found")
              s = s.replace(insert_anchor, helper + insert_anchor, 1)

          old_load = '''  async function loadUnified(force = false) {
              if (state.loading && !force) return;
              state.loading = true;
              const list = $("#gcc-list");
              if (list) list.innerHTML = '<div class="gcc-empty">顧客対応を確認しています…</div>';

              try {
                const [core, threads] = await Promise.all([
                  coreApi("/api/admin/inquiries?limit=200"),
                  lineApi("/api/contact/threads")
                ]);

                const inquiries = Array.isArray(core?.data?.items) ? core.data.items : [];
                state.lineThreads = Array.isArray(threads?.threads) ? threads.threads : [];
                await enrichLineInquiries(inquiries);

                const coreItems = inquiries
                  .filter((row) => row.source !== "line")
                  .map((row) => ({
                    key: `inquiry:${row.id}`,
                    kind: "inquiry",
                    channel: row.source === "website" ? "website" : row.source === "phone" ? "phone" : row.source || "website",
                    id: row.id,
                    title: row.company_name || row.contact_name || "お問い合わせ",
                    sub: row.contact_name || row.phone || row.email || "",
                    preview: row.inquiry_category || "相談受付",
                    status: row.status || "new",
                    at: row.updated_at || row.created_at,
                    unread: row.status === "new" ? 1 : 0,
                    raw: row
                  }));

                const lineItems = state.lineThreads.map((thread) => {
                  const inquiry = state.lineInquiryByUser.get(String(thread.userKey || thread.lineUserId || thread.line_user_id || ""));
                  return {
                    key: `line:${thread.id}`,
                    kind: "line",
                    channel: "line",
                    id: thread.id,
                    inquiryId: inquiry?.id || null,
                    title: thread.displayName || "LINEユーザー",
                    sub: inquiry?.company_name || inquiry?.contact_name || "",
                    preview: thread.lastMessage || "LINE会話",
                    status: thread.status || "open",
                    at: thread.lastMessageAt || thread.updatedAt || thread.createdAt,
                    unread: Number(thread.unreadCount || 0),
                    raw: thread,
                    inquiry
                  };
                });

                state.items = [...coreItems, ...lineItems].sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
                updateCounts();
                applyFilter();

                if (state.selected) {
                  const same = state.items.find((x) => x.key === state.selected.key);
                  if (same) await selectItem(same, false);
                }
              } finally {
                state.loading = false;
              }
            }'''

          new_load = '''  async function loadUnified(force = false) {
              if (state.loading && !force) return;
              state.loading = true;
              const list = $("#gcc-list");
              if (list) list.innerHTML = '<div class="gcc-empty">顧客対応を確認しています…</div>';

              try {
                const [coreResult, lineResult] = await Promise.allSettled([
                  coreApi("/api/admin/inquiries?limit=200"),
                  lineApi("/api/contact/threads")
                ]);

                const coreOk = coreResult.status === "fulfilled";
                const lineOk = lineResult.status === "fulfilled";

                state.channelErrors = [];
                if (!coreOk) {
                  state.channelErrors.push(`WEB・電話: ${coreResult.reason?.message || "取得失敗"}`);
                }
                if (!lineOk) {
                  state.channelErrors.push(`LINE: ${lineResult.reason?.message || "取得失敗"}`);
                }

                if (!coreOk && !lineOk) {
                  throw new Error(state.channelErrors.join(" / "));
                }

                const core = coreOk ? coreResult.value : null;
                const threads = lineOk ? lineResult.value : null;

                const inquiries = Array.isArray(core?.data?.items) ? core.data.items : [];
                state.lineThreads = Array.isArray(threads?.threads) ? threads.threads : [];

                if (coreOk) {
                  await enrichLineInquiries(inquiries);
                } else {
                  state.lineInquiryByUser.clear();
                }

                const coreItems = inquiries
                  .filter((row) => lineOk ? row.source !== "line" : true)
                  .map((row) => ({
                    key: `inquiry:${row.id}`,
                    kind: "inquiry",
                    channel: row.source === "website" ? "website" : row.source === "phone" ? "phone" : row.source === "line" ? "line" : row.source || "website",
                    id: row.id,
                    title: row.company_name || row.contact_name || "お問い合わせ",
                    sub: row.contact_name || row.phone || row.email || "",
                    preview: row.inquiry_category || (row.source === "line" ? "LINE受付（返信接続を再試行してください）" : "相談受付"),
                    status: row.status || "new",
                    at: row.updated_at || row.created_at,
                    unread: row.status === "new" ? 1 : 0,
                    raw: row
                  }));

                const lineItems = state.lineThreads.map((thread) => {
                  const inquiry = state.lineInquiryByUser.get(String(thread.userKey || thread.lineUserId || thread.line_user_id || ""));
                  return {
                    key: `line:${thread.id}`,
                    kind: "line",
                    channel: "line",
                    id: thread.id,
                    inquiryId: inquiry?.id || null,
                    title: thread.displayName || "LINEユーザー",
                    sub: inquiry?.company_name || inquiry?.contact_name || "",
                    preview: thread.lastMessage || "LINE会話",
                    status: thread.status || "open",
                    at: thread.lastMessageAt || thread.updatedAt || thread.createdAt,
                    unread: Number(thread.unreadCount || 0),
                    raw: thread,
                    inquiry
                  };
                });

                state.items = [...coreItems, ...lineItems].sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
                renderChannelWarning();
                updateCounts();
                applyFilter();

                if (state.selected) {
                  const same = state.items.find((x) => x.key === state.selected.key);
                  if (same) await selectItem(same, false);
                }
              } finally {
                state.loading = false;
              }
            }'''
          s = replace_once(s, old_load, new_load, "resilient unified load")

          p.write_text(s, encoding="utf-8")

          # CSS warning
          p = Path("green-customer-contact-r1.css")
          s = p.read_text(encoding="utf-8")
          css = '''
          .gcc-channel-warning{display:grid;gap:4px;margin:0 0 14px;padding:11px 13px;border:1px solid #e0a5a0;border-radius:11px;background:#fff3f1;color:#7f302a}.gcc-channel-warning[hidden]{display:none}.gcc-channel-warning strong{font-size:13px}.gcc-channel-warning span,.gcc-channel-warning small{font-size:12px;line-height:1.55}
          '''
          if ".gcc-channel-warning{" not in s:
              s += css
          p.write_text(s, encoding="utf-8")

          # Cache bust owner loader
          p = Path("owner.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "green-customer-contact-r1.css?v=GREEN-CUSTOMER-CONTACT-R1.1-20261004",
              "green-customer-contact-r1.css?v=GREEN-CUSTOMER-CONTACT-R1.3-RESILIENT-FETCH-20261004"
          )
          s = s.replace(
              "green-customer-contact-r1.js?v=GREEN-CUSTOMER-CONTACT-R1.2-20261004",
              "green-customer-contact-r1.js?v=GREEN-CUSTOMER-CONTACT-R1.3-RESILIENT-FETCH-20261004"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check green-customer-contact-r1.js

          grep -q 'GREEN-CUSTOMER-CONTACT-R1.3-RESILIENT-FETCH-20261004' green-customer-contact-r1.js
          grep -q 'GREEN-CUSTOMER-CONTACT-R1.3-RESILIENT-FETCH-20261004' owner.html
          grep -q 'Promise.allSettled' green-customer-contact-r1.js
          grep -q 'function renderChannelWarning' green-customer-contact-r1.js
          grep -q 'function lineAccessToken' green-customer-contact-r1.js
          grep -q 'LINE接続に失敗しました' green-customer-contact-r1.js
          grep -q 'gcc-channel-warning' green-customer-contact-r1.css

          # LINE cross-origin transport must match the proven legacy contact page:
          # Authorization header, no credentialed cross-origin cookie mode.
          ! grep -A30 'async function lineApi' green-customer-contact-r1.js | grep -q 'credentials: "include"'

          # Existing safeguards/features stay intact.
          grep -q 'const EMAIL_READY = false' green-customer-contact-r1.js
          grep -q 'function lineAttachmentHtml' green-customer-contact-r1.js
          grep -q 'item.inquiry?.status || item.raw?.status || "new"' green-customer-contact-r1.js
          grep -q 'params.get("view") === "customer-contact"' green-customer-contact-r1.js

          git diff --check
          echo "GREEN CUSTOMER CONTACT R1.3 STATIC QA PASS"

      - name: Commit R1.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN CUSTOMER CONTACT R1.3"
          git config user.email "actions@users.noreply.github.com"
          git add green-customer-contact-r1.js green-customer-contact-r1.css owner.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Harden GREEN customer contact fetch R1.3"
          git push origin HEAD:main
