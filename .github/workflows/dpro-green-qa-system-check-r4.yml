name: DPRO GREEN QA System Check R4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch QA R4
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_qa_r4.py
          python /tmp/patch_qa_r4.py

      - name: Verify
        run: |
          git diff --check
          grep -q "PRODUCTION READ-ONLY QA R4" system-check-qa.html
          grep -q 'CORE+"/api/health"' system-check-qa.html

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DPRO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add system-check-qa.html
          git commit -m "Use production Core health endpoint in QA"
          git push
