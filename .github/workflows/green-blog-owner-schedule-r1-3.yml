name: DPRO GREEN Blog Schedule R1.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add scheduled publishing UI
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_blog_schedule_r1_3.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check green-owner-blog-r1.js
          node --check config.js
          grep -q "予約公開" green-owner-blog-r1.js
          grep -q "scheduleDate" green-owner-blog-r1.js
          grep -q "scheduleTime" green-owner-blog-r1.js
          grep -q "予約を保存" green-owner-blog-r1.js
          grep -q "GREEN BLOG SCHEDULE R1.3" green-owner-blog-r1.css
          grep -q "GREEN-BLOG-CMS-OWNER-R1.3-SCHEDULE-20261007" config.js
          grep -q "GREEN-BLOG-CMS-OWNER-R1.3-SCHEDULE-20261007" owner.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-owner-schedule-r1-3.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add GREEN blog scheduled publishing R1.3"
          git push
