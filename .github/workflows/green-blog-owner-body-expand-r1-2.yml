name: DPRO GREEN Blog Body Expand R1.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch blog body editor
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "blog_body_expand_patch.py", "exec"))

      - name: Validate
        shell: bash
        run: |
          node --check green-owner-blog-r1.js
          node --check config.js
          grep -q "data-blog-body-expand" green-owner-blog-r1.js
          grep -q "本文を拡大" green-owner-blog-r1.js
          grep -q "GREEN BLOG BODY EXPAND R1.2" green-owner-blog-r1.css
          grep -q "min-height:320px" green-owner-blog-r1.css
          grep -q "is-body-expanded" green-owner-blog-r1.css
          grep -q "GREEN-BLOG-CMS-OWNER-R1.2-20261006" config.js
          grep -q "GREEN-BLOG-CMS-OWNER-R1.2-20261006" owner.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-owner-body-expand-r1-2.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Expand GREEN blog body editor R1.2"
          git push
